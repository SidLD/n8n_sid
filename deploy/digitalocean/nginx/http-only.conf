# Use this first: ACME on :80 + proxy to n8n (no TLS). After certbot, switch to nginx.conf.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=n8n_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=n8n_webhook:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=n8n_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 50m;
    client_body_timeout 60s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream n8n_backend {
        server n8n:5678;
        keepalive 32;
    }

    # Catch-all (direct IP / unknown host) during HTTP-only phase
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 http://n8n.personalfinancetracker.online$request_uri;
    }

    server {
        listen 80;
        listen [::]:80;
        # Local dev: http://localhost — production: add your real hostname too
        server_name localhost 127.0.0.1 [::1] n8n.personalfinancetracker.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        limit_conn n8n_conn 20;

        location ^~ /webhook/ {
            limit_req zone=n8n_webhook burst=50 nodelay;
            proxy_pass http://n8n_backend;
            include /etc/nginx/snippets/proxy-n8n.conf;
        }

        location / {
            limit_req zone=n8n_general burst=20 nodelay;
            proxy_pass http://n8n_backend;
            include /etc/nginx/snippets/proxy-n8n.conf;
        }
    }
}
