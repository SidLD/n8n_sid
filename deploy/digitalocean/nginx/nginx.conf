# n8n behind nginx on a VPS — rate limits, WebSockets, TLS.
# Domain is configured for personalfinancetracker.online (update if you change domains).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # --- Rate limiting (per client IP) ---
    limit_req_zone $binary_remote_addr zone=n8n_general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=n8n_webhook:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=n8n_conn:10m;

    # Optional: stricter burst for authenticated UI vs webhooks — webhooks get own zone below
    limit_req_status 429;
    limit_conn_status 429;

    # Resize if you upload large files in workflows
    client_max_body_size 50m;
    client_body_timeout 60s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream: Docker service name from compose (internal port)
    upstream n8n_backend {
        server n8n:5678;
        keepalive 32;
    }

    # Catch-all HTTP (e.g. direct IP access) -> redirect to canonical HTTPS hostname.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://n8n.personalfinancetracker.online$request_uri;
    }

    # Catch-all HTTPS (e.g. direct IP access). We can't present a valid cert for the IP,
    # but this provides a deterministic response instead of hitting the app.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/n8n.personalfinancetracker.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/n8n.personalfinancetracker.online/privkey.pem;

        return 301 https://n8n.personalfinancetracker.online$request_uri;
    }

    # HTTP — localhost (no TLS): proxy straight to n8n for local Docker
    server {
        listen 80;
        listen [::]:80;
        server_name localhost 127.0.0.1 [::1];

        limit_conn n8n_conn 20;

        location ^~ /webhook/ {
            limit_req zone=n8n_webhook burst=50 nodelay;
            proxy_pass http://n8n_backend;
            include /etc/nginx/snippets/proxy-n8n.conf;
        }

        location / {
            limit_req zone=n8n_general burst=20 nodelay;
            proxy_pass http://n8n_backend;
            include /etc/nginx/snippets/proxy-n8n.conf;
        }
    }

    # HTTP — ACME + redirect to HTTPS (real domain only)
    server {
        listen 80;
        listen [::]:80;
        server_name n8n.personalfinancetracker.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — reverse proxy to n8n
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name n8n.personalfinancetracker.online;

        ssl_certificate /etc/letsencrypt/live/n8n.personalfinancetracker.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/n8n.personalfinancetracker.online/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Connection cap per IP
        limit_conn n8n_conn 20;

        # Webhooks: higher steady rate (still bounded)
        location ^~ /webhook/ {
            limit_req zone=n8n_webhook burst=50 nodelay;
            proxy_pass http://n8n_backend;
            include /etc/nginx/snippets/proxy-n8n.conf;
        }

        # n8n frontend assets: avoid rate-limiting bursts of JS/CSS
        location ^~ /assets/ {
            proxy_pass http://n8n_backend;
            include /etc/nginx/snippets/proxy-n8n.conf;
            limit_req off;
        }

        # Rest of n8n (editor, API, push)
        location / {
            limit_req zone=n8n_general burst=20 nodelay;
            proxy_pass http://n8n_backend;
            include /etc/nginx/snippets/proxy-n8n.conf;
        }
    }
}
