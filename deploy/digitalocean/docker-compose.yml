# DigitalOcean VPS: n8n (SQLite under /home/node/.n8n) + nginx (80/443).
# Secrets live only in deploy/digitalocean/.env (gitignored). Compose loads it automatically
# for this file’s directory — no need for --env-file when using -f deploy/digitalocean/docker-compose.yml

services:
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:latest}
    restart: unless-stopped
    # Load config from a chosen env file (local default is .env.example).
    # In production, set ENV_FILE=.env (or pass ENV_FILE via your deploy system).
    env_file:
      - ${ENV_FILE:-.env.example}
    environment:
      # Required identity / URL settings
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in your env file}
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in your env file}
      # Behind nginx: n8n must listen HTTP on 5678. Do not set N8N_PORT=443 in .env for this layout.
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_PROXY_HOPS: "1"
      # Default http:// — on VPS set WEBHOOK_URL / N8N_EDITOR_BASE_URL to https://your-domain/
      WEBHOOK_URL: ${WEBHOOK_URL:-http://${N8N_HOST}/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://${N8N_HOST}}
      # Secure session cookies (default true). Plain http://SERVER_IP cannot log in unless you set false in .env (emergency only; prefer https://your-domain).
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      # Allow Code node / $env to read WEBHOOK_SHARED_SECRET (self-hosted only; trusted admins).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:-}
      TZ: ${TZ:-UTC}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}

      # Persisted state location (includes config + SQLite by default)
      N8N_USER_FOLDER: ${N8N_USER_FOLDER:-/home/node/.n8n}
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_SQLITE_DATABASE: ${DB_SQLITE_DATABASE:-${N8N_USER_FOLDER:-/home/node/.n8n}/database.sqlite}
      DB_SQLITE_VACUUM_ON_STARTUP: ${DB_SQLITE_VACUUM_ON_STARTUP:-false}

      # Default DB is SQLite at ~/.n8n/database.sqlite (no Postgres).
      # Trim execution history + binary payloads so uploads (e.g. images) do not linger.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-24}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-100}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-none}
      EXECUTIONS_DATA_SAVE_ON_ERROR: ${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: ${EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS:-false}
      EXECUTIONS_DATA_PRUNE_SOFT_DELETE_INTERVAL: ${EXECUTIONS_DATA_PRUNE_SOFT_DELETE_INTERVAL:-15}
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: ${EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL:-15}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem

      # Optional hardening / ops
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
    expose:
      - "5678"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      # Bind-mount persisted state so you can control location via env.
      # Example: N8N_DATA_DIR=./data/n8n  (relative to this compose file directory)
      - ${N8N_DATA_DIR:-./data/n8n}:${N8N_USER_FOLDER:-/home/node/.n8n}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - n8n_internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets/proxy-n8n.conf:/etc/nginx/snippets/proxy-n8n.conf:ro
      - ${LETSENCRYPT_DIR:-./certs/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-./certs/certbot}:/var/www/certbot:ro
    networks:
      - n8n_internal

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ${LETSENCRYPT_DIR:-./certs/letsencrypt}:/etc/letsencrypt
      - ${CERTBOT_WEBROOT:-./certs/certbot}:/var/www/certbot
    networks:
      - n8n_internal

networks:
  n8n_internal:
    driver: bridge

volumes: {}
